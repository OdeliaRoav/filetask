<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHTMLX Gridpack Local Test</title>
    <link rel="stylesheet" href="node_modules/@dhx/trial-gridpack/codebase/gridpack.min.css">
    <script src="node_modules/@dhx/trial-gridpack/codebase/gridpack.min.js"></script>
    <style>
        body {
            margin: 24px;
            font-family: Arial, sans-serif;
        }

        #grid {
            width: 900px;
            max-width: 100%;
            height: 420px;
        }
    </style>
</head>
<body>
<h1>DHTMLX Gridpack Local Test</h1>
<div id="grid"></div>

<script>
    const grid = new dhx.Grid("grid", {
        columns: [
            { id: "id", header: [{ text: "ID" }], width: 80 },
            { id: "name", header: [{ text: "Name" }], width: 160 },
            { id: "email", header: [{ text: "Email" }], width: 260 },
            { id: "role", header: [{ text: "Role" }], width: 140 }
        ],
        data: [
            { id: 1, name: "Kim", email: "kim@example.com", role: "Admin" },
            { id: 2, name: "Lee", email: "lee@example.com", role: "User" },
            { id: 3, name: "Park", email: "park@example.com", role: "Manager" }
        ],
        autoWidth: true,
        resizable: true,
        selection: "row"
    });
</script>
</body>
</html>
